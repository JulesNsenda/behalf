<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room · Proxy Room</title>
<link rel="icon" href="/ui/logo.svg">
<script src="/ui/theme.js"></script>
<link rel="stylesheet" href="/ui/ui.css">
<script src="/ui/ui.js" defer></script>
<script src="/js/room-view.js" defer></script>
<script src="/js/links.js" defer></script>
<script src="/js/room-core.js" defer></script>
<script src="/js/room-kit.js" defer></script>
<script src="/js/room-setup.js" defer></script>
<script src="/js/room-chat.js" defer></script>
<script src="/js/room.js" defer></script>
</head>
<body>
<div class="page">

<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="/"><img class="brand__logo" src="/ui/logo.svg" alt="">Proxy Room</a>
    <div class="site-header__end"><span class="text-caption" id="room-reconnect" hidden></span><span class="status" id="room-status" role="status" tabindex="-1" hidden></span></div>
  </div>
</header>

<main class="page__main">
<div class="container container--read" id="app"></div>
</main>

<div class="dock dock--warn" id="dock" hidden>
  <div class="dock__inner">
    <div class="dock__body" id="dock-text"></div>
    <button class="btn btn--primary btn--small" type="button" id="dock-answer"></button>
  </div>
</div>

</div>
</body>
</html>
