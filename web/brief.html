<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision brief · Proxy Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.svg">
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="brand" href="/"><img class="logo" src="/logo.svg" alt="">Proxy Room</a>
  <span class="spacer"></span>
  <button class="btn sm noprint" id="share">Copy link</button>
</div></header>
<main class="wrap" id="main" style="padding:24px 16px 60px"><p class="muted">Loading brief…</p></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const id = location.pathname.split('/')[2];
const AUTH = { must_haves: 'must-have', may_agree_to: 'may agree to', must_never: 'protects a must-never', known_facts: 'known fact', amendment: 'human answer', none: 'no authority' };

$('#share').onclick = () => navigator.clipboard.writeText(location.href).then(() => { $('#share').textContent = 'Copied'; setTimeout(() => $('#share').textContent = 'Copy link', 1500); });

fetch(`/api/rooms/${id}`).then(r => r.ok ? r.json() : Promise.reject()).then(R => {
  const b = R.brief;
  document.title = `Brief: ${R.topic}`;
  if (!b) { $('#main').innerHTML = `<h1>${esc(R.topic)}</h1><p class="muted">No brief yet. The proxies are still working. <a href="/room/${id}">Watch the room</a></p>`; return; }
  const name = s => b.parties[s].name;
  const first = s => name(s).split(' ')[0];
  const unv = b.unverified_dependencies;
  const tone = b.outcome !== 'agreed' ? 'red' : unv.length ? 'red' : 'green';
  const headline = b.outcome !== 'agreed' ? 'No agreement'
    : unv.length ? `Agreed, resting on ${unv.length} unverified assumption${unv.length > 1 ? 's' : ''}`
    : 'Agreed. Every term traces to a human or a source.';
  const noAuth = (b.authority || []).filter(a => a.A === 'none' || a.B === 'none').length;

  const terms = b.agreement ? b.agreement.terms.map((t, i) => {
    const a = (b.authority || [])[i];
    return `<div class="term"><div class="t">${i + 1}. ${esc(t)}</div>
      ${a ? `<div class="auth"><span class="seat-A ${a.A}" style="${a.A === 'none' || a.A === 'amendment' ? '' : 'color:var(--a)'}">${esc(first('A'))}: ${AUTH[a.A] || esc(a.A)}</span><span class="seat-B ${a.B}" style="${a.B === 'none' || a.B === 'amendment' ? '' : 'color:var(--b)'}">${esc(first('B'))}: ${AUTH[a.B] || esc(a.B)}</span></div>${a.note ? `<div class="note">${esc(a.note)}</div>` : ''}` : ''}
    </div>`;
  }).join('') : '';

  const claimRow = c => `<div class="claim ${c.origin}"><div class="claim-top"><span class="cid">${esc(c.id)}</span><span class="tag ${c.origin}">${c.origin}</span><span>${esc(c.text)}</span></div>
    <div class="ref">by ${esc(c.seat === 'A' ? name('A') : name('B'))}'s proxy${c.ref ? ' · ref ' + esc(c.ref) : ' · no human or source behind it'}</div>
    ${(c.reviews || []).filter(r => r.verdict !== 'accept').map(r => `<div class="review ${r.verdict}"><span class="verdict">${r.verdict}</span> · ${esc(r.reason)}</div>`).join('')}</div>`;

  const otherUnv = b.unverified_in_record.filter(c => !unv.some(u => u.id === c.id));

  $('#main').innerHTML = `
    <div class="eyebrow">Decision brief · PXP v0</div>
    <h1 style="font-size:clamp(22px,4.4vw,30px);margin-bottom:16px">${esc(R.topic)}</h1>
    <div class="verdict-banner ${tone}">
      <h1>${headline}</h1>
      <p class="muted" style="margin:8px 0 0">${esc(name('A'))} and ${esc(name('B'))} · ${b.turns} proxy turns · ${b.escalations.length} escalation${b.escalations.length === 1 ? '' : 's'}${b.agreement ? ` · proposed by ${esc(first(b.agreement.proposed_by))}, accepted by ${esc(first(b.agreement.accepted_by))}` : ''}</p>
      ${noAuth ? `<p style="margin:10px 0 0;color:var(--conflict)"><b>${noAuth} term${noAuth > 1 ? 's lack' : ' lacks'} authority from one side's card.</b></p>` : ''}
    </div>

    ${b.agreement ? `<div class="section"><h2>What was agreed, and on whose authority</h2>${terms}${b.authority ? '' : '<p class="small muted">Authority per term is mapped by the built-in Claude auditor, which isn\'t enabled on this server. Check each term against your own card.</p>'}</div>` : ''}

    ${b.outcome === 'agreed' ? `<div class="section"><h2>Assumptions this agreement rests on</h2>
      ${unv.length ? unv.map(claimRow).join('') : `<div class="term" style="border-color:rgba(74,222,128,.4)">None. Every claim the agreed terms depend on was stated by a principal or sourced.</div>`}</div>` : ''}

    <div class="section"><h2>Escalations to humans</h2>
      ${b.escalations.length ? b.escalations.map(e => `<div class="term seat-${e.seat}"><div class="who" style="font-size:14px"><span class="avatar">${e.seat}</span>${esc(e.principal)} was asked</div>
        <div class="t" style="margin-top:6px">${esc(e.question)}</div>
        <div class="note" style="color:var(--text)"><b style="color:var(--seat)">Answer${e.via === 'mcp' ? ' (relayed by their agent)' : ''}:</b> ${esc(e.answer || 'not answered')}</div></div>`).join('') : '<div class="term muted">None. The proxies stayed inside their cards.</div>'}</div>

    ${otherUnv.length ? `<div class="section"><h2>Other assumptions on record (not relied on)</h2>${otherUnv.map(claimRow).join('')}</div>` : ''}

    ${b.protocol_flags.length ? `<div class="section"><h2>Protocol enforcement</h2>${b.protocol_flags.map(f => `<div class="flags">⚑ #${f.seq} seat ${f.seat}: ${esc(f.flag)}</div>`).join('')}</div>` : ''}

    <div class="section"><h2>Accountability</h2>
      <div class="term mono xs" style="word-break:break-all">
        <div><span class="faint">${esc(name('A'))}'s proxy</span> ${esc(b.parties.A.proxy || 'Built-in Claude proxy')}</div>
        <div style="margin-top:4px"><span class="faint">${esc(name('B'))}'s proxy</span> ${esc(b.parties.B.proxy || 'Built-in Claude proxy')}</div>
        <div style="margin-top:4px"><span class="faint">${esc(name('A'))} card</span> ${esc(b.parties.A.card_hash)}</div>
        <div style="margin-top:4px"><span class="faint">${esc(name('B'))} card</span> ${esc(b.parties.B.card_hash)}</div>
        ${b.agreement ? `<div style="margin-top:4px"><span class="faint">proposal</span> ${esc(b.agreement.proposal_hash)}</div>` : ''}
        <div style="margin-top:4px"><span class="faint">ledger head</span> ${esc(b.ledger_head || '')} ${b.ledger_ok ? '<span style="color:var(--stated)">✓ chain intact</span>' : '<span style="color:var(--conflict)">✗ chain broken</span>'}</div>
      </div>
      <p class="small muted">The design test: you should be able to explain this decision from this page alone, without opening the transcript. If you can't, the proxies did too much of the thinking. <a href="/room/${id}">Full transcript</a> · <a href="/api/rooms/${id}/ledger">Ledger JSON</a></p>
    </div>
    <div class="noprint" style="margin-top:28px"><a class="btn primary" href="/">Try Proxy Room</a></div>`;
}).catch(() => { $('#main').innerHTML = '<h1>Brief not found</h1><p><a href="/">Back to Proxy Room</a></p>'; });
</script>
</body>
</html>
