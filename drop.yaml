type: nodejs
healthCheck: /health
# Drop provisions Postgres and sets DATABASE_URL. Not declared under secrets: Drop's
# redeploy check counts only secrets set by hand, so a required DATABASE_URL blocks
# every redeploy. /health shows `store: postgres` once it is in use.
database: postgres
# The base layer: anything set in the Drop dashboard overrides these.
env:
  SIGNIN: github
  # Drop sometimes starts the app without DATABASE_URL (a Drop quota bug). The process then exits at once instead of serving an
  # empty file store. The code already defaults this to 1 when DROP_DATA_DIR is set; this is a second layer. Never set it to 0 in
  # the dashboard (it overrides this file) unless you mean to run on the file store.
  REQUIRE_DATABASE: "1"
  PUBLIC_URL: https://behalf.dropkit.sh
  # dev sends nothing (emails go to the outbox folder, with no page on the platform). Switch to smtp in the dashboard once
  # SMTP_HOST, SMTP_PORT, MAIL_FROM and the two SMTP secrets are set and scripts/send-test-mail.js reached an inbox (MAIL.md).
  MAIL_TRANSPORT: dev
# Set in the dashboard, never here. Drop holds the app in needs-config until the required ones are set.
secrets:
  GITHUB_CLIENT_ID:
    required: true
    description: Client ID of the Behalf GitHub OAuth app (callback https://behalf.dropkit.sh/auth/github/callback)
  GITHUB_CLIENT_SECRET:
    required: true
    description: Client secret of the Behalf GitHub OAuth app
  SMTP_USER:
    required: false
    description: SMTP login for sending invites (needed only with MAIL_TRANSPORT=smtp; see MAIL.md)
  SMTP_PASS:
    required: false
    description: SMTP password for sending invites (needed only with MAIL_TRANSPORT=smtp)
